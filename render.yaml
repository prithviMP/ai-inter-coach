# SQLite lives on a persistent disk. Render's normal filesystem is wiped on
# restart and deploy. A disk requires a paid instance (starter or above).
services:
  - type: web
    name: ai-interview-coach-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_PATH
        value: /var/data/coach.db
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: sqlite
      mountPath: /var/data
      sizeGB: 1
